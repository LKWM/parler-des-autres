                    { prompt: "_ ___ 시몬 ___.", subtitle: "C'est Simon.", target: "이 사람은 시몬이에요.", audio: "https://res.cloudinary.com/de76i94ia/video/upload/v1770706157/L10S4_afm6ep.mp3" },
                    { prompt: "시몬_ _ 오빠__.", subtitle: "Simon est mon frère.", target: "시몬은 제 오빠예요.", audio: "https://res.cloudinary.com/de76i94ia/video/upload/v1770706159/L10S5_ytjgot.mp3" },
                    { prompt: "오빠_ ______.", subtitle: "Mon frère est employé.", target: "오빠는 회사원이에요.", audio: "https://res.cloudinary.com/de76i94ia/video/upload/v1770706161/L10S6_ybqms1.mp3" }

        // --- State ---
        let currentIndex = 0;
        let audioPlayer = new Audio();
        let isRecording = false;
        let mediaRecorder;
        let audioChunks = [];
        let correctSound = null;
        let completionSynth = null;
        let pageTurnSynth = null;
        let hasInteracted = false;
        const visitedPages = new Set();
        let autoPlayTimeout = null;
        let recordingTimeout = null; 

        // --- Tone.js ---
        async function initAudio() {
            if (hasInteracted) return;
            await Tone.start();
            correctSound = new Tone.Synth().toDestination();
            completionSynth = new Tone.PolySynth().toDestination();
            pageTurnSynth = new Tone.MembraneSynth({ envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.1 } }).toDestination();
            hasInteracted = true;
        }

        function playPageSound() {
            if (pageTurnSynth && hasInteracted) pageTurnSynth.triggerAttackRelease("C2", "32n");
        }

        // --- Helper: Similarity (Levenshtein based) ---
        function calculateSimilarity(s1, s2) {
            let longer = s1;
            let shorter = s2;
            if (s1.length < s2.length) {
                longer = s2;
                shorter = s1;
            }
            const longerLength = longer.length;
            if (longerLength === 0) return 1.0;
            return (longerLength - editDistance(longer, shorter)) / parseFloat(longerLength);
        }

        function editDistance(s1, s2) {
            s1 = s1.toLowerCase();
            s2 = s2.toLowerCase();
            const costs = [];
            for (let i = 0; i <= s1.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= s2.length; j++) {
                    if (i === 0) costs[j] = j;
                    else {
                        if (j > 0) {
                            let newValue = costs[j - 1];
                            if (s1.charAt(i - 1) !== s2.charAt(j - 1))
                                newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                            costs[j - 1] = lastValue;
                            lastValue = newValue;
                        }
                    }
                }
                if (i > 0) costs[s2.length] = lastValue;
            }
            return costs[s2.length];
        }

        function cleanString(str) {
            return str.replace(/[\s.,?!]/g, "");
        }

        // --- Gemini Speech Recognition ---
        async function sendToGemini(base64Audio, systemInstruction) {
            if (!lessonPermit || !lessonId) throw new Error('Lesson permit is not available yet.');
            const payload = {
                model: "gemini-3.5-flash-lite",
                systemInstruction: systemInstruction,
                contents: [
                    {
                        role: "user",
                        parts: [
                            { 
                                inline_data: { 
                                    mime_type: "audio/webm", 
                                    data: base64Audio 
                                } 
                            }
                        ]
                    }
                ]
            };

            const res = await fetch(GEMINI_FUNCTION_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ...payload, permit: lessonPermit, lesson_id: lessonId })
            });

            if (!res.ok) throw new Error("Gemini API Error: " + res.status);

            const data = await res.json();
            // Backend returns { text: "..." } directly
            const text = (data.text || "").trim();
            return text;
        }

        // --- DOM ---
        const contentArea = document.getElementById('content-area');
        const progressBar = document.getElementById('progress-bar');
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');
        const navArea = document.getElementById('nav-area');

        // --- Core Functions ---
        function updateProgress() {
            const progress = ((currentIndex) / (lessonData.length - 1)) * 100;
            progressBar.style.width = `${progress}%`;
            
            if (currentIndex === 0) prevBtn.classList.add('invisible');
            else {
                prevBtn.classList.remove('invisible');
                prevBtn.disabled = false;
            }
            
            const currentData = lessonData[currentIndex];
            const state = getExerciseState(currentIndex);

            let canProceed = true;
            
            if (currentData.type === 'image_repeat') {
                if (state.passed || state.attempts >= 2) canProceed = true;
                else canProceed = false;
            } else if (currentData.type === 'multi_step_challenge') {
                if (state.isFinished) canProceed = true;
                else canProceed = false;
            }

            nextBtn.disabled = !canProceed;

            if (currentIndex === lessonData.length - 1) {
                nextBtn.innerHTML = `Terminer <i class="ph ph-check text-xl"></i>`;
            } else {
                nextBtn.innerHTML = `Continuer <i class="ph ph-arrow-right font-bold"></i>`;
                navArea.classList.remove('hidden');
            }
        }

        let activeStepMic = null;

        function getRecordBtn() {
            return document.getElementById('record-btn') || activeStepMic;
        }

        function setMicEnabled(enabled) {
            const recordBtn = getRecordBtn();
            if (!recordBtn) return;
            if (enabled) {
                recordBtn.disabled = false;
                recordBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                recordBtn.disabled = true;
                recordBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        function stopAudio() {
            if(audioPlayer) {
                audioPlayer.pause();
                audioPlayer.currentTime = 0;
            }
            if(autoPlayTimeout) clearTimeout(autoPlayTimeout);
            setMicEnabled(true);
        }

        function playAudio(url, onEndCallback, delay = 0) {
            stopAudio();
            if (!url) return;
            setMicEnabled(false);
            autoPlayTimeout = setTimeout(() => {
                audioPlayer.src = url;
                audioPlayer.play().catch(e => { console.log("Audio blocked:", e); setMicEnabled(true); });
                audioPlayer.onended = () => {
                    setMicEnabled(true);
                    if (onEndCallback) onEndCallback();
                };
            }, delay);
        }

        function playAutoAudioIfNeeded(url) {
            if (!visitedPages.has(currentIndex)) {
                visitedPages.add(currentIndex);
                playAudio(url, null, 1000); 
            }
        }

        function getExerciseState(index) {
            if (!exerciseStates[index]) {
                exerciseStates[index] = { 
                    attempts: 0, 
                    passed: false, 
                    lastText: "", 
                    currentStep: 0,
                    stepAttempts: 0,
                    stepPassed: false,
                    isFinished: false 
                };
            }
            return exerciseStates[index];
        }

            `;

                                <button type="button" id="listen-btn" class="w-12 h-12 rounded-full bg-indigo-50 text-indigo-600 hover:bg-indigo-100 flex items-center justify-center transition-all shadow-sm">

                                </button>

                                </button>

                    <div class="w-full pt-2 shrink-0">
                        <div id="feedback-area" class="relative h-14 flex flex-col items-center justify-center w-full text-center gap-0.5 overflow-hidden shrink-0">
                            <span id="fb-msg" class="text-gray-400 text-xs">Appuyez sur le micro pour parler</span>
                            <span id="fb-score" class="text-gray-400 text-xs mt-0.5 line-clamp-2 invisible"></span>
                        </div>
                    </div>
                </div>
            `;

            const listenBtn = document.getElementById('listen-btn');
            const recordBtn = document.getElementById('record-btn');
            activeStepMic = null;

            updateRepeatFeedback(state);

            if (state.passed || state.attempts >= 2) {
                recordBtn.disabled = true;
                recordBtn.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                // 자동 재생 오디오 종료 후 마이크 자동 개방 (강제 중단: 빨간 정지 버튼)
                playAudio(data.refAudio, () => {
                    if (!isRecording && !state.passed && state.attempts < 2) {
                        startRecording(data.korean, 'repeat');
                    }
                }, 800);
            }

            listenBtn.onclick = () => {
                playAudio(data.refAudio);
            };

            recordBtn.onclick = async () => {
                if (state.attempts >= 2 || state.passed) return;
                startRecording(data.korean, 'repeat');
            };
        }

        function updateRepeatFeedback(state) {
            const msgEl = document.getElementById('fb-msg');
            const scoreEl = document.getElementById('fb-score');
            if (!msgEl || !scoreEl) return;

            if (state.passed) {
                msgEl.className = 'text-green-600 font-bold text-sm';
                msgEl.textContent = 'Très bien !';
            } else if (state.attempts >= 2) {
                msgEl.className = 'text-gray-500 text-sm font-bold';
                msgEl.textContent = 'Passons à la suite.';
            } else if (state.attempts > 0) {
                msgEl.className = 'text-orange-500 text-sm font-medium';
                msgEl.textContent = 'Essayez encore.';
            } else {
                msgEl.className = 'text-gray-400 text-xs';
                msgEl.textContent = 'Appuyez sur le micro pour parler';
            }

            if (state.attempts > 0) {
                scoreEl.textContent = `"${state.lastText || ''}" (${state.lastScore ?? '?'})`;
                scoreEl.classList.remove('invisible');
            } else {
                scoreEl.textContent = '';
                scoreEl.classList.add('invisible');
            }
        }

        function setRepeatStatus(text, cls) {
            const msgEl = document.getElementById('fb-msg');
            const scoreEl = document.getElementById('fb-score');
            if (!msgEl) return;
            msgEl.className = cls;
            msgEl.textContent = text;
            if (scoreEl) scoreEl.classList.add('invisible');
        }

        function renderMultiStepChallenge(data) {
            const state = getExerciseState(currentIndex);

            contentArea.innerHTML = `

                    <!-- Cards List -->
                    <div class="w-full max-w-lg space-y-3 shrink-0 card-list overflow-y-auto">
                        ${data.steps.map((step, index) => `
                            <div id="step-card-${index}" class="w-full p-4 rounded-xl border border-gray-200 bg-white shadow-sm flex flex-col gap-2 opacity-100 transition-all duration-300">
                                <div class="flex justify-between items-center">
                                    <div class="flex-1">
                                        <h4 class="grid text-lg font-bold text-gray-800 leading-snug">
                                            <span id="step-prompt-${index}" class="col-start-1 row-start-1">${step.prompt}</span>
                                            <span id="step-target-${index}" class="col-start-1 row-start-1 invisible">${step.target}</span>
                                        </h4>
                                        <p class="text-sm text-gray-500 font-bold">${step.subtitle}</p>
                                    </div>
                                    
                                    <div class="flex items-center gap-2 shrink-0">
                                        <button id="step-audio-${index}" class="invisible w-10 h-10 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center hover:bg-indigo-100 transition-colors shadow-sm shrink-0">
                                            <i class="ph ph-speaker-high text-lg"></i>
                                        </button>
                                        
                                        <button id="step-mic-${index}" class="invisible w-10 h-10 rounded-full bg-red-50 text-red-500 flex items-center justify-center hover:bg-red-100 transition-colors shadow-sm ring-2 ring-transparent shrink-0">
                                            <i class="ph ph-microphone text-lg"></i>
                                        </button>
                                        
                                        <i id="step-check-${index}" class="invisible ph ph-check-circle text-green-500 text-3xl ml-1"></i>
                                    </div>
                                </div>
                                
                                <div id="step-try-${index}" class="invisible text-xs text-center text-orange-500 font-medium mt-1"></div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            updateStepCards(data);
        }

        function updateStepCards(data) {
            const state = getExerciseState(currentIndex);

            data.steps.forEach((step, index) => {
                const card = document.getElementById('step-card-' + index);
                if (!card) return;

                const isCompleted = index < state.currentStep;
                const isActive = index === state.currentStep && !state.isFinished;
                const isLocked = !isCompleted && !isActive;

                card.classList.toggle('opacity-40', isLocked);
                card.classList.toggle('grayscale', isLocked);

                card.classList.remove('border-gray-200', 'bg-white', 'border-green-300', 'bg-green-50', 'border-indigo-400', 'ring-2', 'ring-indigo-100');
                if (isCompleted || (isActive && state.stepPassed)) {
                    card.classList.add('border-green-300', 'bg-green-50');
                } else if (isActive) {
                    card.classList.add('border-indigo-400', 'ring-2', 'ring-indigo-100');
                } else {
                    card.classList.add('border-gray-200', 'bg-white');
                }

                const showTarget = (isActive && (state.stepAttempts >= 2 || state.stepPassed)) || isCompleted;
                document.getElementById('step-prompt-' + index).classList.toggle('invisible', showTarget);
                document.getElementById('step-target-' + index).classList.toggle('invisible', !showTarget);

                const showAudio = (isActive && (state.stepAttempts >= 1 || state.stepPassed)) || isCompleted;
                const audioBtn = document.getElementById('step-audio-' + index);
                audioBtn.classList.toggle('invisible', !showAudio);
                audioBtn.onclick = () => playAudio(step.audio);

                const micBtn = document.getElementById('step-mic-' + index);
                const showMic = isActive && !state.stepPassed;
                micBtn.classList.toggle('invisible', !showMic);
                if (showMic) {
                    activeStepMic = micBtn;
                    micBtn.onclick = () => startRecording(step.target, 'multi_step');
                } else if (activeStepMic === micBtn) {
                    activeStepMic = null;
                }

                document.getElementById('step-check-' + index).classList.toggle('invisible', !(isCompleted || (isActive && state.stepPassed)));

                const tryEl = document.getElementById('step-try-' + index);
                const showTry = isActive && state.stepAttempts > 0 && !state.stepPassed;
                tryEl.classList.toggle('invisible', !showTry);
                if (showTry) tryEl.textContent = `Essayez encore (${state.stepAttempts}/3)`;
            });
        }

        // --- Shared Recording Logic ---
        async function startRecording(referenceText, mode) {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    
                    mediaRecorder.onstop = async () => {
                        stream.getTracks().forEach(track => track.stop());
                        if (recordingTimeout) clearTimeout(recordingTimeout);
                        
                        try {
                            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                            const reader = new FileReader();
                            reader.readAsDataURL(audioBlob);
                            reader.onloadend = async () => {
                                const base64 = reader.result.split(',')[1];
                                await processSpeech(base64, referenceText, currentIndex, mode);
                            };
                        } catch (e) {
                            console.error("Error processing audio", e);
                        }
                    };
                    
                    mediaRecorder.start();
                    isRecording = true;
                    
                    const recordBtn = getRecordBtn();
                    const feedbackArea = document.getElementById('feedback-area');

                    if (recordBtn) {
                        recordBtn.classList.remove('bg-red-50', 'text-red-500');
                        recordBtn.classList.add('bg-red-500', 'text-white', 'animate-pulse');
                        const iconSize = mode === 'multi_step' ? 'text-lg' : 'text-xl';
                        recordBtn.innerHTML = `<i class="ph ph-stop ${iconSize}"></i>`;
                    }

                    if (mode === 'repeat') setRepeatStatus('Enregistrement...', 'text-indigo-600 animate-pulse text-xs');

                    // Auto-stop after 10 seconds
                    recordingTimeout = setTimeout(() => {
                        if (isRecording && mediaRecorder.state === 'recording') {
                            mediaRecorder.stop();
                            isRecording = false;
                            
                            if (document.contains(recordBtn)) {
                                recordBtn.classList.remove('bg-red-500', 'text-white', 'animate-pulse');
                                recordBtn.classList.add('bg-red-50', 'text-red-500');
                                const iconSize = mode === 'multi_step' ? 'text-lg' : 'text-xl';
                                recordBtn.innerHTML = `<i class="ph ph-microphone ${iconSize}"></i>`;
                            }
                            if (mode === 'repeat') setRepeatStatus('Analyse...', 'text-gray-400 text-xs');
                        }
                    }, 10000);

                } catch (err) {
                    console.error(err);
                }
            } else {
                if (recordingTimeout) clearTimeout(recordingTimeout);
                mediaRecorder.stop();
                isRecording = false;
                
                const recordBtn = document.getElementById('record-btn');
                const feedbackArea = document.getElementById('feedback-area');

                if (recordBtn) {
                    recordBtn.classList.remove('bg-red-500', 'text-white', 'animate-pulse');
                    recordBtn.classList.add('bg-red-50', 'text-red-500');
                    const iconSize = mode === 'multi_step' ? 'text-lg' : 'text-xl';
                    recordBtn.innerHTML = `<i class="ph ph-microphone ${iconSize}"></i>`;
                }
                if (mode === 'repeat') setRepeatStatus('Analyse...', 'text-gray-400 text-xs');
            }
        }


        async function processSpeech(audioBase64, referenceText, pageIndex, mode) {
            const state = getExerciseState(pageIndex);
            
            if (mode === 'repeat') state.attempts++;
            else state.stepAttempts++; 

            try {
                const systemInstruction = "유저의 발화값을 한글로 전사하라.";
                const recognizedText = await sendToGemini(audioBase64, systemInstruction);

                state.lastText = recognizedText; 

                const cleanRef = cleanString(referenceText);
                const cleanRec = cleanString(recognizedText);
                const similarityScore = calculateSimilarity(cleanRec, cleanRef);
                const matchScore = Math.round(similarityScore * 100);
                const passed = matchScore >= 80;
                
                state.lastScore = matchScore;

                if (mode === 'multi_step') {
                    if (passed || state.stepAttempts >= 3) {
                        if(correctSound) correctSound.triggerAttackRelease('C5', '0.2s');
                        
                        state.stepPassed = false;
                        state.stepAttempts = 0;
                        state.lastText = "";
                        state.currentStep++;
                        
                        if (state.currentStep >= lessonData[currentIndex].steps.length) {
                            state.isFinished = true; 
                            updateProgress(); 
                        }
                    } else {
                        if(correctSound) correctSound.triggerAttackRelease('G2', '0.2s');
                    }
                } else {
                    if (passed) {
                        if(correctSound) correctSound.triggerAttackRelease('C5', '0.2s');
                        state.passed = true;
                    } else {
                        if(correctSound) correctSound.triggerAttackRelease('G2', '0.2s');
                    }
                }

            } catch (e) {
                console.error("Speech Eval Failed:", e);
                if(correctSound) correctSound.triggerAttackRelease('G2', '0.2s');
                state.lastText = "Erreur de connexion";
                
                if (mode === 'multi_step' && state.stepAttempts >= 3) {
                    if(correctSound) correctSound.triggerAttackRelease('C5', '0.2s');
                    state.stepAttempts = 0;
                    state.currentStep++;
                    state.lastText = "";
                    if (state.currentStep >= lessonData[currentIndex].steps.length) {
                        state.isFinished = true;
                        updateProgress();
                    }
                }
            }
            if (mode === 'multi_step') {
                updateStepCards(lessonData[pageIndex]);
            } else {
                updateRepeatFeedback(state);
                const repeatBtn = getRecordBtn();
                if (repeatBtn && (state.passed || state.attempts >= 2)) {
                    repeatBtn.disabled = true;
                    repeatBtn.classList.add('opacity-50', 'cursor-not-allowed');
                }
                if (!state.passed && state.attempts < 2) {
                    // 실패 후 오디오 재생 → 종료 시 마이크 자동 개방
                    playAudio(lessonData[pageIndex].refAudio, () => {
                        if (!isRecording && !state.passed && state.attempts < 2) {
                            startRecording(referenceText, 'repeat');
                        }
                    }, 800);
                }
            }
            updateProgress();
        }

        function renderOutro(data) {
            navArea.classList.add('hidden');
            contentArea.innerHTML = `
                <div class="fade-in w-full h-full flex flex-col items-center justify-center gap-6 text-center max-w-2xl mx-auto">
                    <h2 class="text-xl md:text-2xl font-bold text-gray-800">Terminé !</h2>
                    <div class="w-full bg-indigo-600 text-white p-6 rounded-2xl shadow-lg text-base leading-relaxed">
                        ${data.text}
                    </div>
                </div>
            `;
            if (completionSynth) setTimeout(() => completionSynth.triggerAttackRelease(["C5", "E5", "G5", "C6"], "4n"), 500);
            window.parent.postMessage({ type: 'lesson_complete' }, '*');
        }

        // --- Render Engine ---
        function render() {
            stopAudio();
            if (isRecording) {
                if (recordingTimeout) clearTimeout(recordingTimeout);
                try { if (mediaRecorder && mediaRecorder.state !== 'inactive') { mediaRecorder.onstop = null; mediaRecorder.stop(); } } catch (e) {}
                isRecording = false;
            }
            updateProgress();
            const data = lessonData[currentIndex];
            contentArea.innerHTML = ''; 

            switch(data.type) {
                case 'cover': renderCover(data); break;
                case 'image_repeat': renderImageRepeat(data); break;
                case 'multi_step_challenge': renderMultiStepChallenge(data); break;
                case 'outro': renderOutro(data); break;
                default: console.error("Unknown type");
            }
        }

        async function nextPage() {
            await initAudio(); 
            playPageSound();

            const currentData = lessonData[currentIndex];
            const state = getExerciseState(currentIndex);

            if (currentData.type === 'multi_step_challenge') {
                if (!state.isFinished) {
                    return;
                }
            }

            if (currentIndex < lessonData.length - 1) {
                currentIndex++;
                render();
            }
        }

        function prevPage() {
            playPageSound();
            if (currentIndex > 0) {
                currentIndex--;
                render();
            }
        }

        nextBtn.addEventListener('click', nextPage);
        prevBtn.addEventListener('click', prevPage);

        render();
    </script>
</body>
