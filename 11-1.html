        // --- State ---
        let currentIndex = 0;

        // --- Tone.js ---
        async function initAudio() {
            if (hasInteracted) return;
            await Tone.start();
            correctSound = new Tone.Synth().toDestination();
            completionSynth = new Tone.PolySynth().toDestination();
            pageTurnSynth = new Tone.MembraneSynth({ envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.1 } }).toDestination();
            hasInteracted = true;
        }

        function playPageSound() {
            if (pageTurnSynth && hasInteracted) pageTurnSynth.triggerAttackRelease("C2", "32n");
        }

        // --- Helper: Similarity ---
        function calculateSimilarity(s1, s2) {
            const clean1 = s1.replace(/\s/g, '');
            const clean2 = s2.replace(/\s/g, '');
            let longer = clean1, shorter = clean2;
            if (clean1.length < clean2.length) { longer = clean2; shorter = clean1; }
            const longerLength = longer.length;
            if (longerLength === 0) return 1.0;
            return (longerLength - editDistance(longer, shorter)) / parseFloat(longerLength);
        }

        function editDistance(s1, s2) {
            s1 = s1.toLowerCase();
            s2 = s2.toLowerCase();
            const costs = [];
            for (let i = 0; i <= s1.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= s2.length; j++) {
                    if (i === 0) costs[j] = j;
                    else {
                        if (j > 0) {
                            let newValue = costs[j - 1];
                            if (s1.charAt(i - 1) !== s2.charAt(j - 1)) newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                            costs[j - 1] = lastValue;
                            lastValue = newValue;
                        }
                    }
                }
                if (i > 0) costs[s2.length] = lastValue;
            }
            return costs[s2.length];
        }

        // --- Gemini Speech Recognition ---
        async function sendToGemini(base64Audio) {
            if (!lessonPermit || !lessonId) throw new Error('Lesson permit is not available yet.');
            const payload = {
                model: "gemini-3.5-flash-lite",
                systemInstruction: "유저 발화를 한글로 전사하시오",
                contents: [
                    {
                        role: "user",
                        parts: [
                            { inline_data: { mime_type: "audio/webm", data: base64Audio } }
                        ]
                    }
                ]
            };

            const res = await fetch(GEMINI_FUNCTION_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ...payload, permit: lessonPermit, lesson_id: lessonId })
            });

            if (!res.ok) throw new Error("Gemini API Error: " + res.status);
            const data = await res.json();
            return (data.text || "").trim();
        }

        // --- DOM ---
        const contentArea = document.getElementById('content-area');
        const progressBar = document.getElementById('progress-bar');
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');
        const navArea = document.getElementById('nav-area');

        // --- Core Functions ---
        function updateProgress() {
            const progress = ((currentIndex) / (lessonData.length - 1)) * 100;
            progressBar.style.width = `${progress}%`;
            
            if (currentIndex === 0) prevBtn.classList.add('invisible');
            else {
                prevBtn.classList.remove('invisible');
                prevBtn.disabled = false;
            }
            
            const currentData = lessonData[currentIndex];
            const state = getExerciseState(currentIndex);

            let canProceed = true;
            if (currentData.type === 'question') {
                if (state.passed || state.attempts >= 3) canProceed = true;
                else canProceed = false;
            }

            nextBtn.disabled = !canProceed;

            if (currentIndex === lessonData.length - 1) {
                nextBtn.innerHTML = `Terminer <i class="ph ph-check text-xl"></i>`;
            } else {
                nextBtn.innerHTML = `Continuer <i class="ph ph-arrow-right font-bold"></i>`;
                navArea.classList.remove('hidden');
            }
        }

        function updateRecordButtonState() {
            const recordBtn = document.getElementById('record-btn');
            const state = getExerciseState(currentIndex);
            if (!recordBtn) return;
            
            if (isAudioPlaying) {
                recordBtn.classList.add('opacity-50', 'cursor-not-allowed');
                recordBtn.disabled = true;
                return;
            }

            if (state.passed || state.attempts >= 3) {
                recordBtn.classList.add('opacity-50', 'cursor-not-allowed');
                recordBtn.disabled = true;
            } else {
                recordBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                recordBtn.disabled = false;
            }
        }

        function stopAudio() {
            if(audioPlayer) {
                audioPlayer.pause();
                audioPlayer.currentTime = 0;
            }
            if(autoPlayTimeout) clearTimeout(autoPlayTimeout);
            isAudioPlaying = false;
            updateRecordButtonState();
        }

        function playAudio(url, onEndCallback, delay = 0) {
            stopAudio();
            if (!url) return;
            
            isAudioPlaying = true;
            updateRecordButtonState();

            autoPlayTimeout = setTimeout(() => {
                audioPlayer.src = url;
                audioPlayer.play()
                .then(() => {
                    isAudioPlaying = true;
                    updateRecordButtonState();
                })
                .catch(e => {
                    console.log("Audio blocked:", e);
                    isAudioPlaying = false;
                    updateRecordButtonState();
                });
                
                audioPlayer.onended = () => { 
                    isAudioPlaying = false;
                    updateRecordButtonState();
                    if (onEndCallback) onEndCallback(); 
                };
            }, delay);
        }

        function playQuestionAudioAuto(url) {
            if (!url) return;
            playAudio(url, null, 1000);
        }

        function getExerciseState(index) {
            if (!exerciseStates[index]) {

        const IMG_SPECS = {

            "https://res.cloudinary.com/de76i94ia/image/upload/v1771155283/image_D_tmcaka.png": { fT: 0.1800, fB: 0.1800, fL: 0.1000, fR: 0.1009 },

            "https://res.cloudinary.com/de76i94ia/image/upload/v1771155262/image_F_jkmxx3.png": { fT: 0.0800, fB: 0.0800, fL: 0.2602, fR: 0.2611 },

        };
        function revealQuestion() {
            const card = document.getElementById('q-card');
            if (card && card.style.visibility === 'hidden') card.style.visibility = 'visible';
        }
        let qRevealArmed = false, qFitDigest = '', qFitStable = 0, qRevealTries = 0, qFitChangedAt = 0;
        function markFitDigest() {
            const card = document.getElementById('q-card');
            const qText = document.getElementById('q-text');
            const imgEl = document.getElementById('q-img');
            if (!card || !qText || !imgEl) return;
            const mic = document.getElementById('record-btn');
            const dig = card.style.getPropertyValue('--qg') + '|' + imgEl.style.height + '|' + qText.style.fontSize + '|' + card.style.paddingBottom + '|' + (mic ? (mic.getBoundingClientRect().y * 2).toFixed(0) : 0);
            if (dig === qFitDigest) qFitStable++;
            else { qFitStable = 0; qFitChangedAt = performance.now(); }
            qFitDigest = dig;
        }
        function tryReveal() {
            if (!qRevealArmed || !qFontsReady) return;
            if ((qFitStable >= 2 && performance.now() - qFitChangedAt >= 500) || qRevealTries >= 40) { revealQuestion(); return; } // 계산이 안정된 뒤에만 표시: 마지막 변화 후 500ms 이상 동일
            qRevealTries++;
            setTimeout(() => { if (document.getElementById('q-card')) fitQuestionLayout(); tryReveal(); }, 120);
        }

        // 진동 방지: 모바일 주소창 접힘 등 미세 뷰포트 변화는 무시하고, 의미 있는 변화(회전·창 크기 변화)만 재계산한다.
        // 마이크는 첫 표시부터 최종 위치에 고정 — 레이아웃 확정(이미지 여백 분석 완료) 후에만 카드를 표시한다.
        let qSizeLatch = null, qFontsReady = false;
        function qViewportRelatch() {
            const w = window.innerWidth, h = window.innerHeight;
            const card = document.getElementById('q-card');
            const ch = card ? card.clientHeight : 0;
            if (!qSizeLatch) { qSizeLatch = { w, h, ch }; return true; }
            if (w !== qSizeLatch.w || Math.abs(h - qSizeLatch.h) >= 90 || Math.abs(ch - qSizeLatch.ch) >= 90) { qSizeLatch = { w, h, ch }; return true; }
            return false;
        }

        // 세로: 이미지(상단 여백 포함)는 화면 세로의 45%까지, 나머지 공간은 글씨와 간격이 채운다.
        //        글씨 크기는 남는 공간에 맞춰 커진다(화면이 작을 때만 줄어든다), 간격과 위/아래 여백은 동일.
        //        마이크 아래 여백 = 이미지 위 여백 + 이미지 안의 여백(보이는 그림의 위 여백과 동일).
        // 가로(가로 > 세로x1.2): 좌우 1:1 병렬 — 왼쪽 중앙 이미지(높이 = 박스의 80%), 오른쪽 텍스트가 박스를 채운다.
        // 마이크는 첫 시도 오른쪽 박스 중앙, 안내 메시지 표시 시점부터 메시지 하단. 마이크 규격은 프로그램 공통.
        function fitQuestionLayout() {
            const card = document.getElementById('q-card');
            const imgEl = document.getElementById('q-img');
            if (!card || !imgEl) return;

            qViewportRelatch();
            const metaCur = IMG_SPECS[imgEl.getAttribute('src')] || null;
            const refQ = lessonData.find(d => d.type === 'question') || {};
            const fT = (IMG_SPECS[refQ.image] || {}).fT || 0; // 1번 문제(가장 큰 이미지) 기준 통일 규격 — 모든 문제 동일 크기·동일 위치

            const blocks = ['qtext-block', 'q-trans', 'hint-cell', 'feedback-msg'].map(id => document.getElementById(id)).filter(Boolean);
            const micRow = document.getElementById('mic-row');
            const micBtn = document.getElementById('record-btn');
            const micH = micRow ? micRow.offsetHeight : 0;
            const cardH = card.clientHeight;
            const cardW = card.clientWidth;
            const land = qSizeLatch.w > qSizeLatch.h * 1.2;
            card.classList.toggle('q-land', land);
            const qCol = document.getElementById('q-col');
            if (qCol) qCol.classList.toggle('q-wide', land);
            if (micRow) micRow.style.minHeight = land && micBtn ? micBtn.offsetHeight + 'px' : '';
            card.style.setProperty('--micr', (micBtn ? micBtn.offsetHeight / 2 : 40) + 'px');

            const qText = document.getElementById('q-text');
            const trans = document.getElementById('q-trans');
            const pills = card.querySelectorAll('.q-pill');
            const fbMsg = document.getElementById('fb-msg');
            const fbScore = document.getElementById('fb-score');
            const bH = () => blocks.reduce((a, el) => a + el.offsetHeight, 0);
            const lh = el => { el.style.lineHeight = '1.3'; return el; };
            const applyFonts = (sc) => {
                card.style.setProperty('--qb', (32 * sc).toFixed(2) + 'px');
                if (qText) lh(qText).style.fontSize = (20 * sc).toFixed(2) + 'px';
                if (trans) lh(trans).style.fontSize = (14 * sc).toFixed(2) + 'px';
                pills.forEach(p => { lh(p).style.fontSize = (16 * sc).toFixed(2) + 'px'; p.style.padding = (6 * sc).toFixed(2) + 'px ' + (16 * sc).toFixed(2) + 'px'; });
                if (fbMsg) lh(fbMsg).style.fontSize = (14 * sc).toFixed(2) + 'px';
                const fbSizer = document.getElementById('fb-sizer');
                if (fbSizer) lh(fbSizer).style.fontSize = (14 * sc).toFixed(2) + 'px';
                if (fbScore) lh(fbScore).style.fontSize = (14 * sc).toFixed(2) + 'px';
            };
            const setImg = (w, h, metaCur) => {
                imgEl.style.width = w.toFixed(2) + 'px';
                imgEl.style.height = h.toFixed(2) + 'px';
                imgEl.style.marginBottom = '0px';
                if (metaCur) { // 가로: 보이는 그림(내부 여백 제외)이 박스 정중앙에 오도록 보정
                    imgEl.style.marginTop = (-(metaCur.fT - metaCur.fB) / 2 * h).toFixed(2) + 'px';
                    imgEl.style.marginLeft = (-(metaCur.fL - metaCur.fR) / 2 * w).toFixed(2) + 'px';
                } else {
                    imgEl.style.marginTop = '0px';
                    imgEl.style.marginLeft = '0px';
                }
            };
            // 안내 메시지는 어떤 상태에서도 한 줄: 가장 긴 안내 문구 기준으로 상한 배율 측정(측정 시점 배율 비례)
            const nowrapCap = (boxW, sCur) => {
                if (!fbMsg) return Infinity;
                const t = fbMsg.textContent;
                fbMsg.textContent = 'Vous y êtes presque. Essayez encore une fois.';
                const w1 = fbMsg.scrollWidth;
                fbMsg.textContent = t;
                return w1 > 0 && w1 > boxW ? sCur * boxW / w1 : Infinity;
            };
            // 글씨 배율: 남는 공간(간격 gapKxs + 구성요소)을 목표치로 채울 때까지 반복 측정
            const solveScale = (target, gapK) => {
                let sc = Math.max(0.02, target / (gapK + 175));
                for (let i = 0; i < 8; i++) {
                    applyFonts(sc);
                    const used = gapK * sc + bH();
                    if (Math.abs(used - target) < 1) return sc;
                    const ns = Math.max(0.02, sc * target / Math.max(1, used));
                    if (Math.abs(ns - sc) < 0.005) { applyFonts(ns); return ns; }
                    sc = ns;
                }
                applyFonts(sc);
                return sc;
            };

            applyFonts(1);

            if (land) {
                const leftBox = document.getElementById('q-left');
                const rightBox = document.getElementById('q-right');
                const boxW = (rightBox ? rightBox.clientWidth : cardW / 2) * 0.92 - qSizeLatch.h * 0.012;
                let sc = solveScale(cardH - micH, 48);
                const cap = nowrapCap(boxW, sc);
                if (cap !== Infinity && cap < sc) { sc = Math.max(0.02, cap); applyFonts(sc); }
                card.style.paddingBottom = '';
                card.style.setProperty('--qg', Math.max(0.5, 8 * sc).toFixed(2) + 'px'); // 줄간격은 일반 비율 유지 — 남는 높이는 상하 여백(중앙 정렬)으로
                const lbH = leftBox ? leftBox.clientHeight : cardH;
                const lbW = leftBox ? leftBox.clientWidth : cardW / 2;
                let h = Math.min(lbH * 0.8, lbW * 1.25);
                setImg(h / 1.25, h, metaCur);
                markFitDigest();
                return;
            }

            const innerW = cardW - qSizeLatch.h * 0.012;
            const Hs = qSizeLatch.h;
            const target = Math.max(50, cardH - 0.45 * Hs - micH); // 7G + 이미지(1+fT) + 구성요소
            let sc = solveScale(target, 48);
            const cap = nowrapCap(innerW, sc);
            if (cap !== Infinity && cap < sc) { sc = Math.max(0.02, cap); applyFonts(sc); }
            const C = bH();

            // 밴드(상단 여백 + 이미지)를 정확히 45%로: 간격이 남는 공간을 흡수
            let g = (target - C) / 6;
            let imgH = (0.45 * Hs - g) / (1 + fT);
            let imgW = imgH / 1.25;
            if (imgW > innerW) { // 폭 제한: 밴드가 45%보다 작아도 간격이 여유를 흡수
                imgW = innerW; imgH = imgW * 1.25;
                g = (cardH - imgH * (1 + fT) - micH - C) / 7;
            }
            if (g < 0.5 || imgH < 40) { // 극한 화면: 잘림 방지 우선, 이미지 축소
                imgH = Math.max(40, (cardH - micH - C - 3.5) / (1 + fT));
                imgW = imgH / 1.25;
                if (imgW > innerW) { imgW = innerW; imgH = imgW * 1.25; }
                g = Math.max(0.5, (cardH - imgH * (1 + fT) - micH - C) / 7);
            }
            g = Math.max(0.5, g);
            setImg(imgW, imgH);
            card.style.setProperty('--qg', g.toFixed(2) + 'px');
            card.style.paddingBottom = (g + fT * imgH).toFixed(2) + 'px'; // 마이크 아래 = 이미지 위 여백 + 이미지 안의 여백
            markFitDigest();
        }

        window.addEventListener('resize', () => { if (document.getElementById('q-card') && qViewportRelatch()) fitQuestionLayout(); });
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { qFontsReady = true; if (document.getElementById('q-card')) { fitQuestionLayout(); tryReveal(); } });
        function watchQuestionLayout() {
            const img = document.getElementById('q-img');
            if (img && !img.dataset.fitBound) {
                img.dataset.fitBound = '1';
                img.addEventListener('load', () => fitQuestionLayout());
                img.addEventListener('error', () => { qRevealArmed = true; tryReveal(); });
            }
            const card = document.getElementById('q-card');
            if (card && window.ResizeObserver && !card.dataset.fitBound) {
                card.dataset.fitBound = '1';
                new ResizeObserver(() => {
                    if (card.dataset.fitting) return;
                    card.dataset.fitting = '1';
                    fitQuestionLayout();
                    requestAnimationFrame(() => { delete card.dataset.fitting; });
                }).observe(card);
            }
            setTimeout(() => { if (document.getElementById('q-card')) { fitQuestionLayout(); tryReveal(); } }, 80);
            setTimeout(() => { if (document.getElementById('q-card')) { fitQuestionLayout(); tryReveal(); } }, 350);
            setTimeout(() => { if (document.getElementById('q-card')) revealQuestion(); }, 4000);
        }
        function renderQuestion(data) {
            const state = getExerciseState(currentIndex);

            if (state.attempts === 0 && !state.passed) {
                playQuestionAudioAuto(data.qAudio);
            }

            contentArea.innerHTML = `
                <div id="q-col" class="fade-in w-full h-full flex flex-col items-center max-w-2xl mx-auto">
                    <div class="w-full flex justify-center pb-2 shrink-0">
                        <h3 class="text-xs text-indigo-600 uppercase tracking-wider text-center font-bold">
                            Regardez l'image et répondez à la question.
                        </h3>
                    </div>

                    <div id="q-card" class="bg-white w-full rounded-3xl shadow-xl border border-gray-100 relative flex flex-col items-center z-10 flex-1 min-h-0 overflow-hidden" style="padding: var(--qg, 0.5rem) 0.6vh; gap: var(--qg, 0.5rem); visibility: hidden;">

                        <div id="q-split" class="contents w-full flex-1 min-h-0">
                        <div id="q-left" class="contents">
                        <img id="q-img" src="${data.image}" crossorigin="anonymous" class="rounded-xl object-cover shrink-0" alt="Question Image">
                        </div>
                        <div id="q-right" class="contents w-full flex flex-col items-center" style="gap: var(--qg, 0.5rem);">

                        <div id="qtext-block" class="invisible w-full flex items-center justify-center gap-2 px-2 shrink-0">
                            <button id="q-audio-btn" onclick="playAudio('${data.qAudio}')" class="invisible rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center hover:bg-indigo-100 transition-colors shadow-sm shrink-0" style="width: var(--qb, 32px); height: var(--qb, 32px);"><i class="ph ph-speaker-high" style="font-size: calc(var(--qb, 32px) * 0.56);"></i></button>
                            <h2 id="q-text" class="font-bold text-gray-800 text-center leading-snug">${data.qText}</h2>
                        </div>

                        <p id="q-trans" class="invisible text-gray-500 text-center px-2 leading-snug shrink-0">${data.qTrans}</p>

                        <div id="hint-cell" class="grid w-full shrink-0">
                            <p id="hint1" class="q-pill invisible col-start-1 row-start-1 justify-self-center text-indigo-600 font-medium bg-indigo-50 rounded-lg">${data.hint1}</p>
                            <p id="hint2" class="q-pill invisible col-start-1 row-start-1 justify-self-center text-orange-600 font-medium bg-orange-50 rounded-lg">Mot clé : ${data.hint2}</p>
                            <div id="hint3" class="invisible col-start-1 row-start-1 justify-self-center flex items-center gap-2">
                                ${data.aAudio ? `
                                    <button id="a-audio-btn" onclick="playAudio('${data.aAudio}')" class="rounded-full bg-green-100 text-green-600 flex items-center justify-center hover:bg-green-200 transition-colors shrink-0" style="width: var(--qb, 32px); height: var(--qb, 32px);"><i class="ph ph-speaker-high" style="font-size: calc(var(--qb, 32px) * 0.56);"></i></button>
                                ` : ''}
                                <p class="q-pill text-green-600 font-bold bg-green-50 rounded-lg">${data.hint3}</p>
                            </div>
                        </div>

                        <div id="feedback-msg" class="relative w-full flex flex-col items-center shrink-0" style="gap: var(--qg, 0.5rem);">
                            <span id="fb-sizer" class="hidden font-bold whitespace-nowrap">\u00A0</span>
                            <span id="fb-msg" class="invisible font-bold whitespace-nowrap max-w-full overflow-hidden text-ellipsis">\u00A0</span>
                            <span id="fb-score" class="invisible font-normal text-gray-400 whitespace-nowrap max-w-full overflow-hidden text-ellipsis">\u00A0</span>
                        </div>

                        <div id="mic-row" class="w-full flex justify-center shrink-0">
                            <button id="record-btn" class="w-16 h-16 md:w-20 md:h-20 rounded-full bg-red-100 text-red-500 hover:bg-red-200 flex items-center justify-center transition-all ring-4 ring-transparent shadow-md">
                                <i class="ph ph-microphone text-3xl md:text-4xl"></i>
                            </button>
                        </div>

                        </div>
                        </div>
                    </div>
                </div>
            `;

            updateQuestionUI(data, state);
            fitQuestionLayout();
            requestAnimationFrame(() => fitQuestionLayout());
            watchQuestionLayout();
            qRevealArmed = true; requestAnimationFrame(() => { fitQuestionLayout(); tryReveal(); }); // 이미지 규격은 상수로 알고 있음: 렌더 즉시 확정
            requestAnimationFrame(() => fitQuestionLayout());


            const recordBtn = document.getElementById('record-btn');

            recordBtn.onclick = async () => {
                if (isAudioPlaying) return;
                if (state.passed || state.attempts >= 3) return;
                startRecording(data.hint3);
            };
        }

        function updateQuestionUI(data, state) {
            const showQText = state.attempts >= 1 || state.passed;
            const showHint1 = state.attempts === 1 && !state.passed;
            const showQTrans = state.attempts >= 2 || state.passed;
            const showHint2 = state.attempts === 2 && !state.passed;
            const showHint3 = state.attempts >= 3 || state.passed;
            const showQAudioBtn = state.attempts >= 1 || state.passed;

            const vis = (id, visible) => {
                const el = document.getElementById(id);
                if (el) el.classList.toggle('invisible', !visible);
            };

            vis('qtext-block', showQText);
            vis('q-audio-btn', showQAudioBtn);
            vis('q-trans', showQTrans);
            vis('hint1', showHint1);
            vis('hint2', showHint2);
            vis('hint3', showHint3);

            const fbMsg = document.getElementById('fb-msg');
            const fbScore = document.getElementById('fb-score');
            const sizerEl = document.getElementById('fb-sizer');
            if (sizerEl) sizerEl.classList.add('hidden');
            const fbBlockEl = document.getElementById('feedback-msg');
            if (fbBlockEl) fbBlockEl.classList.remove('q-status');
            if (fbMsg && fbScore) {
                if (state.passed) {
                    fbMsg.className = 'font-bold whitespace-nowrap max-w-full overflow-hidden text-ellipsis text-green-600';
                    fbMsg.textContent = 'Très bien. Passons à la question suivante.';
                } else if (state.attempts >= 3) {
                    fbMsg.className = 'font-bold whitespace-nowrap max-w-full overflow-hidden text-ellipsis text-green-600';
                    fbMsg.textContent = 'Passons à la question suivante.';
                } else if (state.attempts > 0) {
                    fbMsg.className = 'font-bold whitespace-nowrap max-w-full overflow-hidden text-ellipsis text-orange-500';
                    fbMsg.textContent = 'Vous y êtes presque. Essayez encore une fois.';
                } else {
                    fbMsg.className = 'invisible font-bold whitespace-nowrap';
                    fbMsg.textContent = '\u00A0';
                }

                if (state.attempts > 0 || state.passed) {
                    fbScore.className = 'text-gray-400 font-normal whitespace-nowrap max-w-full overflow-hidden text-ellipsis';
                    fbScore.textContent = `"${state.lastText || ''}" (${state.lastScore ?? '?'}%)`;
                } else {
                    fbScore.className = 'invisible font-normal whitespace-nowrap';
                    fbScore.textContent = '\u00A0';
                }
            }

            const recordBtn = document.getElementById('record-btn');
            if (recordBtn && (state.passed || state.attempts >= 3)) {
                recordBtn.disabled = true;
                recordBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }

            const micRowEl = document.getElementById('mic-row');
            if (micRowEl) micRowEl.classList.toggle('msg-shown', state.attempts > 0 || state.passed);
        }

        function setQuestionStatus(text, cls) {
            const msgEl = document.getElementById('fb-msg');
            const scoreEl = document.getElementById('fb-score');
            if (!msgEl) return;
            msgEl.className = 'absolute inset-0 flex items-center justify-center ' + cls;
            msgEl.textContent = text;
            if (scoreEl) scoreEl.classList.add('invisible');
            const sizer = document.getElementById('fb-sizer');
            if (sizer) sizer.classList.remove('hidden');
            const fbBlock = document.getElementById('feedback-msg');
            if (fbBlock) fbBlock.classList.add('q-status');
        }

        // --- Recording Logic ---
        async function startRecording(targetText) {
            const recordBtn = document.getElementById('record-btn');
            const feedbackMsg = document.getElementById('feedback-msg');
            
            if (isAudioPlaying) return;

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    
                    mediaRecorder.onstop = async () => {
                        isRecording = false;
                        stream.getTracks().forEach(track => track.stop());
                        if (recordingTimeout) clearTimeout(recordingTimeout);
                        
                        try {
                            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                            const reader = new FileReader();
                            reader.readAsDataURL(audioBlob);
                            reader.onloadend = async () => {
                                const base64 = reader.result.split(',')[1];
                                await processSpeech(base64, targetText);
                            };
                        } catch (e) {
                            console.error("Error processing audio", e);
                        }
                        
                        if (recordBtn) {
                            const st = getExerciseState(currentIndex);
                            if (!st.passed && st.attempts < 3) {
                                recordBtn.classList.remove('bg-red-500', 'text-white', 'ring-red-200');
                                recordBtn.classList.add('bg-red-100', 'text-red-500', 'hover:bg-red-200');
                                recordBtn.innerHTML = `<i class="ph ph-microphone text-3xl md:text-4xl"></i>`;
                            }
                        }
                        setQuestionStatus('Analyse...', 'text-gray-400 font-bold whitespace-nowrap');
                    };
                    
                    mediaRecorder.start();
                    isRecording = true;
                    
                    if (recordBtn) {
                        recordBtn.classList.remove('bg-red-100', 'text-red-500', 'hover:bg-red-200');
                        recordBtn.classList.add('bg-red-500', 'text-white', 'ring-red-200');
                        recordBtn.innerHTML = `<i class="ph ph-stop text-3xl md:text-4xl"></i>`;
                    }
                    setQuestionStatus('Enregistrement...', 'text-indigo-600 animate-pulse font-bold whitespace-nowrap');

                    // Auto-stop after 8 seconds
                    recordingTimeout = setTimeout(() => {
                        if (isRecording && mediaRecorder.state === 'recording') {
                            mediaRecorder.stop();
                        }
                    }, 8000);

                } catch (err) {
                    console.error(err);
                    isRecording = false; 
                    if (feedbackMsg) feedbackMsg.innerHTML = '<span class="text-red-500">Erreur micro</span>';
                }
            } else {
                if (recordingTimeout) clearTimeout(recordingTimeout);
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                    mediaRecorder.stop();
                } else {
                    isRecording = false;
                    if (recordBtn) {
                        recordBtn.classList.remove('bg-red-500', 'text-white', 'ring-red-200');
                        recordBtn.classList.add('bg-red-100', 'text-red-500', 'hover:bg-red-200');
                        recordBtn.innerHTML = `<i class="ph ph-microphone text-3xl md:text-4xl"></i>`;
                    }
                }
            }
        }

        async function processSpeech(audioBase64, targetText) {
            const state = getExerciseState(currentIndex);
            
            try {
                const recognizedText = await sendToGemini(audioBase64);
                state.lastText = recognizedText;

                const cleanTarget = targetText.replace(/[\s.,?!]/g, "");
                const cleanRec = recognizedText.replace(/[\s.,?!]/g, "");
                
                let similarity = 0;
                if (cleanTarget.length > 0) {
                    const dist = editDistance(cleanRec, cleanTarget);
                    similarity = (Math.max(cleanTarget.length, cleanRec.length) - dist) / Math.max(cleanTarget.length, cleanRec.length);
                }

                const matchScore = Math.round(similarity * 100);
                state.lastScore = matchScore;

                if (similarity >= 0.7) {
                    state.passed = true;
                    if(correctSound) correctSound.triggerAttackRelease('C5', '0.2s');
                } else {
                    state.attempts++;
                    if (state.attempts >= 3) {
                        if(correctSound) correctSound.triggerAttackRelease('C5', '0.2s');
                    } else {
                        if(correctSound) correctSound.triggerAttackRelease('G2', '0.2s');
                    }
                }

            } catch (e) {
                console.error("Speech Eval Failed:", e);
                state.lastText = "Erreur de connexion";
                state.lastScore = null;
                state.attempts++;
                if (state.attempts >= 3) {
                    if(correctSound) correctSound.triggerAttackRelease('C5', '0.2s');
                } else {
                    if(correctSound) correctSound.triggerAttackRelease('G2', '0.2s');
                }
            }
            updateQuestionUI(lessonData[currentIndex], state);
            updateProgress();
            if (!state.passed && state.attempts < 3) { // 실패 후 재시도: 질문 오디오 1회 자동 재생(효과음과 겹치지 않게 지연)
                const qa = lessonData[currentIndex].qAudio;
                if (qa) setTimeout(() => { if (!isRecording && !isAudioPlaying) playAudio(qa); }, 600);
            }
        }

        function renderOutro(data) {
            navArea.classList.add('hidden');
            contentArea.innerHTML = `
                <div class="fade-in w-full h-full flex flex-col items-center justify-center gap-6 text-center max-w-2xl mx-auto">
                    <h2 class="text-xl md:text-2xl font-bold text-gray-800">Terminé !</h2>
                    <div class="w-full bg-indigo-600 text-white p-6 rounded-2xl shadow-lg text-base leading-relaxed">
                        ${data.text}
                    </div>
                </div>
            `;
            if (completionSynth) setTimeout(() => completionSynth.triggerAttackRelease(["C5", "E5", "G5", "C6"], "4n"), 500);
            window.parent.postMessage({ type: 'lesson_complete' }, '*');
        }

        function render() {
            if (isRecording) {
                if (recordingTimeout) clearTimeout(recordingTimeout);
                try { if (mediaRecorder && mediaRecorder.state !== 'inactive') { mediaRecorder.onstop = null; mediaRecorder.stop(); } } catch (e) {}
                isRecording = false;
            }
            updateProgress();
            const data = lessonData[currentIndex];
            contentArea.innerHTML = ''; 

            switch(data.type) {
                case 'cover': renderCover(data); break;
                case 'question': renderQuestion(data); break;
                case 'outro': renderOutro(data); break;
                default: console.error("Unknown type");
            }
        }

        async function nextPage() {
            await initAudio(); 
            playPageSound();
            stopAudio(); 
            if (currentIndex < lessonData.length - 1) {
                currentIndex++;
                render();
            }
        }

        function prevPage() {
            playPageSound();
            stopAudio();
            if (currentIndex > 0) {
                currentIndex--;
                render();
            }
        }

        nextBtn.addEventListener('click', nextPage);
        prevBtn.addEventListener('click', prevPage);

        render();
    </script>
</body>
</html>
