        // --- State ---
        let currentIndex = 0;
        let audioPlayer = new Audio();
        let isRecording = false;
        let isAudioPlaying = false; 
        let mediaRecorder;
        let audioChunks = [];
        let correctSound = null;
        let completionSynth = null;
        let pageTurnSynth = null;
        let hasInteracted = false;
        let autoPlayTimeout = null;
        let recordingTimeout = null; 

        // --- Tone.js ---
        async function initAudio() {
            if (hasInteracted) return;
            await Tone.start();
            correctSound = new Tone.Synth().toDestination();
            completionSynth = new Tone.PolySynth().toDestination();
            pageTurnSynth = new Tone.MembraneSynth({ envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.1 } }).toDestination();
            hasInteracted = true;
        }

        function playPageSound() {
            if (pageTurnSynth && hasInteracted) pageTurnSynth.triggerAttackRelease("C2", "32n");
        }

        // --- Helper: Similarity ---
        function calculateSimilarity(s1, s2) {
            const clean1 = s1.replace(/\s/g, '');
            const clean2 = s2.replace(/\s/g, '');
            let longer = clean1, shorter = clean2;
            if (clean1.length < clean2.length) { longer = clean2; shorter = clean1; }
            const longerLength = longer.length;
            if (longerLength === 0) return 1.0;
            return (longerLength - editDistance(longer, shorter)) / parseFloat(longerLength);
        }

        function editDistance(s1, s2) {
            s1 = s1.toLowerCase();
            s2 = s2.toLowerCase();
            const costs = [];
            for (let i = 0; i <= s1.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= s2.length; j++) {
                    if (i === 0) costs[j] = j;
                    else {
                        if (j > 0) {
                            let newValue = costs[j - 1];
                            if (s1.charAt(i - 1) !== s2.charAt(j - 1)) newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                            costs[j - 1] = lastValue;
                            lastValue = newValue;
                        }
                    }
                }
                if (i > 0) costs[s2.length] = lastValue;
            }
            return costs[s2.length];
        }

        // --- Gemini Speech Recognition ---
        async function sendToGemini(base64Audio) {
            if (!lessonPermit || !lessonId) throw new Error('Lesson permit is not available yet.');
            const payload = {
                model: "gemini-3.5-flash-lite",
                systemInstruction: "유저 발화를 한글로 전사하시오",
                contents: [
                    {
                        role: "user",
                        parts: [
                            { inline_data: { mime_type: "audio/webm", data: base64Audio } }
                        ]
                    }
                ]
            };

            const res = await fetch(GEMINI_FUNCTION_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ...payload, permit: lessonPermit, lesson_id: lessonId })
            });

            if (!res.ok) throw new Error("Gemini API Error: " + res.status);
            const data = await res.json();
            return (data.text || "").trim();
        }

        // --- DOM ---
        const contentArea = document.getElementById('content-area');
        const progressBar = document.getElementById('progress-bar');
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');
        const navArea = document.getElementById('nav-area');

        // --- Core Functions ---
        function updateProgress() {
            const progress = ((currentIndex) / (lessonData.length - 1)) * 100;
            progressBar.style.width = `${progress}%`;
            
            if (currentIndex === 0) prevBtn.classList.add('invisible');
            else {
                prevBtn.classList.remove('invisible');
                prevBtn.disabled = false;
            }
            
            const currentData = lessonData[currentIndex];
            const state = getExerciseState(currentIndex);

            let canProceed = true;
            if (currentData.type === 'question') {
                if (state.passed || state.attempts >= 3) canProceed = true;
                else canProceed = false;
            }

            nextBtn.disabled = !canProceed;

            if (currentIndex === lessonData.length - 1) {
                nextBtn.innerHTML = `Terminer <i class="ph ph-check ld-i-xl"></i>`;
            } else {
                nextBtn.innerHTML = `Continuer <i class="ph ph-arrow-right font-bold"></i>`;
                navArea.classList.remove('hidden');
            }
        }

        function updateRecordButtonState() {
            const recordBtn = document.getElementById('record-btn');
            const state = getExerciseState(currentIndex);
            if (!recordBtn) return;
            
            if (isAudioPlaying) {
                recordBtn.classList.add('opacity-50', 'cursor-not-allowed');
                recordBtn.disabled = true;
                return;
            }

            if (state.passed || state.attempts >= 3) {
                recordBtn.classList.add('opacity-50', 'cursor-not-allowed');
                recordBtn.disabled = true;
            } else {
                recordBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                recordBtn.disabled = false;
            }
        }

        function stopAudio() {
            if(audioPlayer) {
                audioPlayer.pause();
                audioPlayer.currentTime = 0;
            }
            if(autoPlayTimeout) clearTimeout(autoPlayTimeout);
            isAudioPlaying = false;
            updateRecordButtonState();
        }

        function playAudio(url, onEndCallback, delay = 0) {
            stopAudio();
            if (!url) return;
            
            isAudioPlaying = true;
            updateRecordButtonState();

            autoPlayTimeout = setTimeout(() => {
                audioPlayer.src = url;
                audioPlayer.play()
                .then(() => {
                    isAudioPlaying = true;
                    updateRecordButtonState();
                })
                .catch(e => {
                    console.log("Audio blocked:", e);
                    isAudioPlaying = false;
                    updateRecordButtonState();
                });
                
                audioPlayer.onended = () => { 
                    isAudioPlaying = false;
                    updateRecordButtonState();
                    if (onEndCallback) onEndCallback(); 
                };
            }, delay);
        }

        function playQuestionAudioAuto(url) {
            if (!url) return;
            playAudio(url, null, 1000);
        }

        function getExerciseState(index) {
            if (!exerciseStates[index]) {
                exerciseStates[index] = {

                        </div>
                    </div>
                </div>
            `;

            updateQuestionUI(data, state);

            const recordBtn = document.getElementById('record-btn');

            recordBtn.onclick = async () => {
                if (isAudioPlaying) return;
                if (state.passed || state.attempts >= 3) return;
                startRecording(data.hint3);
            };
        }

        function updateQuestionUI(data, state) {
            const showQText = state.attempts >= 1 || state.passed;
            const showHint1 = state.attempts === 1 && !state.passed;
            const showQTrans = state.attempts >= 2 || state.passed;
            const showHint2 = state.attempts === 2 && !state.passed;
            const showHint3 = state.attempts >= 3 || state.passed;
            const showQAudioBtn = state.attempts >= 1 || state.passed;

            const vis = (id, visible) => {
                const el = document.getElementById(id);
                if (el) el.classList.toggle('invisible', !visible);
            };

            vis('qtext-block', showQText);
            vis('q-audio-btn', showQAudioBtn);
            vis('q-trans', showQTrans);
            vis('hint1', showHint1);
            vis('hint2', showHint2);
            vis('hint3', showHint3);

            const fbMsg = document.getElementById('fb-msg');
            const fbScore = document.getElementById('fb-score');
            if (fbMsg && fbScore) {
                if (state.passed) {
                    fbMsg.className = 'text-green-600';
                    fbMsg.textContent = 'Très bien. Passons à la question suivante.';
                } else if (state.attempts >= 3) {
                    fbMsg.className = 'text-green-600';
                    fbMsg.textContent = 'Passons à la question suivante.';
                } else if (state.attempts > 0) {
                    fbMsg.className = 'text-orange-500';
                    fbMsg.textContent = 'Vous y êtes presque. Essayez encore une fois.';
                } else {
                    fbMsg.className = 'invisible';
                    fbMsg.textContent = '\u00A0';
                }

                if (state.attempts > 0) {
                    fbScore.className = 'text-gray-400 ld-q-score font-normal';
                    fbScore.textContent = `"${state.lastText || ''}" (${state.lastScore ?? '?'}%)`;
                } else {
                    fbScore.className = 'invisible ld-q-score font-normal';
                    fbScore.textContent = '\u00A0';
                }
            }

            const recordBtn = document.getElementById('record-btn');
            if (recordBtn && (state.passed || state.attempts >= 3)) {
                recordBtn.disabled = true;
                recordBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        function setQuestionStatus(text, cls) {
            const msgEl = document.getElementById('fb-msg');
            const scoreEl = document.getElementById('fb-score');
            if (!msgEl) return;
            msgEl.className = cls;
            msgEl.textContent = text;
            if (scoreEl) scoreEl.classList.add('invisible');
        }

        // --- Recording Logic ---
        async function startRecording(targetText) {
            const recordBtn = document.getElementById('record-btn');
            const feedbackMsg = document.getElementById('feedback-msg');
            
            if (isAudioPlaying) return;

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    
                    mediaRecorder.onstop = async () => {
                        isRecording = false;
                        stream.getTracks().forEach(track => track.stop());
                        if (recordingTimeout) clearTimeout(recordingTimeout);
                        
                        try {
                            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                            const reader = new FileReader();
                            reader.readAsDataURL(audioBlob);
                            reader.onloadend = async () => {
                                const base64 = reader.result.split(',')[1];
                                await processSpeech(base64, targetText);
                            };
                        } catch (e) {
                            console.error("Error processing audio", e);
                        }
                        
                        if (recordBtn) {
                            const st = getExerciseState(currentIndex);
                            if (!st.passed && st.attempts < 3) {
                                recordBtn.classList.remove('bg-red-500', 'text-white', 'ring-red-200');
                                recordBtn.classList.add('bg-red-50', 'text-red-500', 'hover:bg-red-100');
                                recordBtn.innerHTML = `<i class="ph ph-microphone ld-q-mic-i"></i>`;
                            }
                        }
                        setQuestionStatus('Analyse...', 'text-gray-400 ld-q-score');
                    };
                    
                    mediaRecorder.start();
                    isRecording = true;
                    
                    if (recordBtn) {
                        recordBtn.classList.remove('bg-red-50', 'text-red-500', 'hover:bg-red-100');
                        recordBtn.classList.add('bg-red-500', 'text-white', 'ring-red-200');
                        recordBtn.innerHTML = `<i class="ph ph-stop ld-q-mic-i"></i>`;
                    }
                    setQuestionStatus('Enregistrement...', 'text-indigo-600 animate-pulse ld-q-score');

                    // Auto-stop after 8 seconds
                    recordingTimeout = setTimeout(() => {
                        if (isRecording && mediaRecorder.state === 'recording') {
                            mediaRecorder.stop();
                        }
                    }, 8000);

                } catch (err) {
                    console.error(err);
                    isRecording = false; 
                    if (feedbackMsg) feedbackMsg.innerHTML = '<span class="text-red-500">Erreur micro</span>';
                }
            } else {
                if (recordingTimeout) clearTimeout(recordingTimeout);
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                    mediaRecorder.stop();
                } else {
                    isRecording = false;
                    if (recordBtn) {
                        recordBtn.classList.remove('bg-red-500', 'text-white', 'ring-red-200');
                        recordBtn.classList.add('bg-red-50', 'text-red-500', 'hover:bg-red-100');
                        recordBtn.innerHTML = `<i class="ph ph-microphone ld-q-mic-i"></i>`;
                    }
                }
            }
        }

        async function processSpeech(audioBase64, targetText) {
            const state = getExerciseState(currentIndex);
            
            try {
                const recognizedText = await sendToGemini(audioBase64);
                state.lastText = recognizedText;

                const cleanTarget = targetText.replace(/[\s.,?!]/g, "");
                const cleanRec = recognizedText.replace(/[\s.,?!]/g, "");
                
                let similarity = 0;
                if (cleanTarget.length > 0) {
                    const dist = editDistance(cleanRec, cleanTarget);
                    similarity = (Math.max(cleanTarget.length, cleanRec.length) - dist) / Math.max(cleanTarget.length, cleanRec.length);
                }

                const matchScore = Math.round(similarity * 100);
                state.lastScore = matchScore;

                if (similarity >= 0.7) {
                    state.passed = true;
                    if(correctSound) correctSound.triggerAttackRelease('C5', '0.2s');
                } else {
                    state.attempts++;
                    if (state.attempts >= 3) {
                        if(correctSound) correctSound.triggerAttackRelease('C5', '0.2s');
                    } else {
                        if(correctSound) correctSound.triggerAttackRelease('G2', '0.2s');
                    }
                }

            } catch (e) {
                console.error("Speech Eval Failed:", e);
                state.lastText = "Erreur de connexion";
                state.lastScore = null;
                state.attempts++;
                if (state.attempts >= 3) {
                    if(correctSound) correctSound.triggerAttackRelease('C5', '0.2s');
                } else {
                    if(correctSound) correctSound.triggerAttackRelease('G2', '0.2s');
                }
            }
            updateQuestionUI(lessonData[currentIndex], state);
            updateProgress();
        }

        function renderOutro(data) {
            navArea.classList.add('hidden');
            contentArea.innerHTML = `
                <div class="fade-in w-full h-full flex flex-col items-center justify-center ld-outro-gap text-center ld-outro-max mx-auto">
                    <h2 class="ld-outro-title font-bold text-gray-800">Terminé !</h2>
                    <div class="w-full bg-indigo-600 text-white ld-outro-box shadow-lg leading-relaxed">
                        ${data.text}
                    </div>
                </div>
            `;
            if (completionSynth) setTimeout(() => completionSynth.triggerAttackRelease(["C5", "E5", "G5", "C6"], "4n"), 500);
            window.parent.postMessage({ type: 'lesson_complete' }, '*');
        }

        function render() {
            if (isRecording) {
                if (recordingTimeout) clearTimeout(recordingTimeout);
                try { if (mediaRecorder && mediaRecorder.state !== 'inactive') { mediaRecorder.onstop = null; mediaRecorder.stop(); } } catch (e) {}
                isRecording = false;
            }
            updateProgress();
            const data = lessonData[currentIndex];
            contentArea.innerHTML = ''; 

            switch(data.type) {
                case 'cover': renderCover(data); break;
                case 'question': renderQuestion(data); break;
                case 'outro': renderOutro(data); break;
                default: console.error("Unknown type");
            }
        }

        async function nextPage() {
            await initAudio(); 
            playPageSound();
            stopAudio(); 
            if (currentIndex < lessonData.length - 1) {
                currentIndex++;
                render();
            }
        }

        function prevPage() {
            playPageSound();
            stopAudio();
            if (currentIndex > 0) {
                currentIndex--;
                render();
            }
        }

        nextBtn.addEventListener('click', nextPage);
        prevBtn.addEventListener('click', prevPage);

        render();
    </script>
</body>
</html>
